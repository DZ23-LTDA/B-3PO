# B-3PO — gates da branch de produto.
#
# Roda só o que é reproduzível sem segredo e sem infraestrutura especial:
#   - gate de marca (brand_check): assets, contraste AA, cor proibida, nível 3 proibido
#   - testes de domínio (schema do Bot v1 + adaptador de orquestração)
#   - typecheck do desktop
#
# Não publica, não assina, não acessa credencial. Actions fixadas por SHA (política do repo).
name: b3po-brand gates

on:
  push:
    branches: [b3po-brand]
  pull_request:
    branches: [b3po-brand, main]

permissions:
  contents: read

jobs:
  brand-gates:
    name: brand + domain contracts
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: gate de marca
        run: python scripts/brand_check.py

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # o repo exige node >=26 (engine-strict no .npmrc)
          node-version: '26'
          cache: npm

      - name: dependencias
        run: npm ci --no-audit --no-fund

      - name: testes de dominio (schema, orquestracao, mascotes, look)
        working-directory: apps/desktop
        run: >-
          npx vitest run
          src/plugins/hermes-bots/bot-schema.test.ts
          src/plugins/hermes-bots/orchestration.test.ts
          src/plugins/hermes-bots/mascots.test.ts
          src/plugins/hermes-bots/mascot-grid.test.tsx
          src/plugins/hermes-bots/edit-profile-look.test.ts

      - name: auditoria de producao (nenhuma alta)
        run: npm audit --omit=dev --audit-level=high
      - name: testes do CRM (consentimento, webhook, contatos)
        run: npx vitest run --root crm
      - name: typecheck do desktop
        working-directory: apps/desktop
        run: npm run typecheck

      - name: SBOM (informativo, nao falha o build)
        continue-on-error: true
        run: npm sbom --sbom-format cyclonedx > sbom.json

